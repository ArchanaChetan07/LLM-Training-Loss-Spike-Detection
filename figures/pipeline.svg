<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c9c7c1;stroke-width:1.4;rx:10}
      .key{fill:#eaf2fc;stroke:#2a78d6;stroke-width:1.6}
      .h{font-size:15px;font-weight:600;fill:#0b0b0b}
      .t{font-size:12.5px;fill:#52514e}
      .m{font-size:12px;fill:#2a78d6;font-family:Consolas, Menlo, monospace}
      .ln{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lab{font-size:11.5px;fill:#52514e}
    </style>
  </defs>
  <rect width="960" height="430" fill="#fbfbfa"/>
  <text x="24" y="34" class="h" style="font-size:18px">spikewatch: telemetry → e-values → anytime-valid alarm</text>

  <!-- row 1 -->
  <rect class="box" x="24" y="60" width="200" height="150"/>
  <text x="40" y="86" class="h">1 · Telemetry</text>
  <text x="40" y="108" class="t">OLMo W&amp;B logs (1B, 7B,</text>
  <text x="40" y="124" class="t">1.7-7B, OLMo-2) + own runs</text>
  <text x="40" y="148" class="m">loss · clip · ‖g‖</text>
  <text x="40" y="166" class="m">gmax · update ratio</text>
  <text x="40" y="184" class="m">Adam staleness · curv</text>

  <rect class="box" x="260" y="60" width="200" height="150"/>
  <text x="276" y="86" class="h">2 · Causal residual</text>
  <text x="276" y="108" class="t">robust z per signal:</text>
  <text x="276" y="132" class="m">r_t = (x_t − med) / MAD</text>
  <text x="276" y="156" class="t">trailing window only</text>
  <text x="276" y="172" class="t">(no look-ahead)</text>

  <rect class="box" x="496" y="60" width="200" height="150"/>
  <text x="512" y="86" class="h">3 · Conformal p-value</text>
  <text x="512" y="108" class="t">randomized tail rank of r_t</text>
  <text x="512" y="124" class="t">among its own history</text>
  <text x="512" y="148" class="m">p_t ~ U(0,1) under H0</text>
  <text x="512" y="172" class="t">heavy-tail robust</text>

  <rect class="box" x="732" y="60" width="204" height="150"/>
  <text x="748" y="86" class="h">4 · Tail e-value</text>
  <text x="748" y="108" class="t">cluster-aware calibrator</text>
  <text x="748" y="132" class="m">e = Σ w·1[p≤β]/(ρ(s)β)</text>
  <text x="748" y="156" class="t">ρ(s) fitted once on</text>
  <text x="748" y="172" class="t">OLMo-1B 10k–250k, frozen</text>

  <path class="ln" d="M224 135 H256"/>
  <path class="ln" d="M460 135 H492"/>
  <path class="ln" d="M696 135 H728"/>
  <path class="ln" d="M834 210 V250 H700"/>

  <!-- row 2 -->
  <rect class="box" x="496" y="250" width="200" height="150"/>
  <text x="512" y="276" class="h">5 · Combine signals</text>
  <text x="512" y="298" class="t">average over signals</text>
  <text x="512" y="314" class="t">observed at step t</text>
  <text x="512" y="338" class="m">ē_t = mean_s e_t,s</text>
  <text x="512" y="362" class="t">valid with no independence</text>
  <text x="512" y="378" class="t">assumption</text>

  <rect class="key" x="260" y="250" width="200" height="150" rx="10"/>
  <text x="276" y="276" class="h">6 · e-detector</text>
  <text x="276" y="298" class="t">mixture Shiryaev–Roberts</text>
  <text x="276" y="322" class="m">R_t=(R_{t−1}+1)(1−λ+λē_t)</text>
  <text x="276" y="346" class="t">λ ∈ {.05,.2,.5,.8}, averaged</text>
  <text x="276" y="362" class="t">R_t − t is a supermartingale</text>

  <rect class="box" x="24" y="250" width="200" height="150"/>
  <text x="40" y="276" class="h">7 · Alarm</text>
  <text x="40" y="300" class="m">G-rate: R ≥ W/α → restart</text>
  <text x="40" y="318" class="t">E[#FA / 1000 steps] ≤ 5%</text>
  <text x="40" y="344" class="m">G-run: R ≥ T/α</text>
  <text x="40" y="362" class="t">P(any FA in run) ≤ 5%</text>
  <text x="40" y="384" class="t">+ confidence-sequence readout</text>

  <path class="ln" d="M496 325 H464"/>
  <path class="ln" d="M260 325 H228"/>
  <text x="720" y="240" class="lab">e-values per signal</text>
</svg>
